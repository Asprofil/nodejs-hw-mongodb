tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: Retrieves a contact by their ID
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
    description: The ID of the contact to retrieve
responses:
  200:
    description: Successfully retrieved contact
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            phone:
              type: string
            photo:
              type: string
  404:
    description: Contact not found
