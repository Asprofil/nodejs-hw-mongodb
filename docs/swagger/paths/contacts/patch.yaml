tags:
  - Contacts
summary: Update contact by ID
operationId: updateContactById
description: Updates a contact's information by their ID
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
    description: The ID of the contact to update
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
          phone:
            type: string
responses:
  200:
    description: Contact updated successfully
  404:
    description: Contact not found
